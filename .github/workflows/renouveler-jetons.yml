name: Renouveler les jetons Instagram

on:
  schedule:
    # Le 1er et le 15 de chaque mois (jetons valables 60 jours : large marge)
    - cron: "23 4 1,15 * *"
  workflow_dispatch:

concurrency:
  group: publication-instagram
  cancel-in-progress: false

jobs:
  renouveler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pynacl
      - name: Prolonger les deux jetons
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_BASKTECH: ${{ secrets.IG_TOKEN_BASKTECH }}
        run: python renouveler_jetons.py
