name: Post Instagram Padel du jour

on:
  schedule:
    # GitHub retarde ou saute parfois les tâches planifiées : trois déclenchements rapprochés
    # (9h17, 9h47, 10h17 UTC, soit l'heure du Maroc). Le garde-fou de publish.py
    # empêche tout doublon : le premier qui passe publie, les suivants ne font rien.
    - cron: "17 9 * * *"
    - cron: "47 9 * * *"
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      post_date:
        description: "Date à publier (AAAA-MM-JJ), vide = aujourd'hui"
        required: false
        default: ""

concurrency:
  group: publication-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publier le post du jour
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: alex@basktech.io
          POST_DATE: ${{ github.event.inputs.post_date }}
        run: python publish.py

  basktech:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publier le post BaskTech
        env:
          IG_USER_ID: ${{ '17841458411785397' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_TOKEN_BASKTECH }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: alex@basktech.io
          POSTS_DIR: basktech
          ACCOUNT_NAME: BaskTech
          POST_DATE: ${{ github.event.inputs.post_date }}
        run: python publish.py
